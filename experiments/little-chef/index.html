<main class="app"><header class="top"><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M10 25V16C0 15 5 3 14 7C17-1 30 1 30 8C41 7 42 19 32 20V30H10Z" fill="#fffdf7" stroke="#558571" stroke-width="2"/><path d="M10 26H32V33Q21 37 10 33Z" fill="#77a78a"/><path d="M17 14V23M25 14V23" stroke="#cfdbc8" stroke-width="2"/></svg>Little Chef <span class="trial">試玩</span></div><button id="levels" class="pill" aria-label="選擇關卡"><span id="level-label">1 / 4</span><span aria-hidden="true">⌄</span></button><div id="balance" class="pill coins" role="status" aria-label="金幣 30"><span aria-hidden="true">●</span><span id="money">30</span></div><button id="sound" class="icon sound-on" aria-label="關閉聲音" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9H7L12 5V19L7 15H3Z" fill="currentColor"/><g class="waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 9Q18 12 15 15M18 6Q24 12 18 18"/></g><path class="mute-mark" d="M16 9L22 15M22 9L16 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></header>

<div id="welcome" class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="welcome-title"><div class="eyebrow">PAPA LAB · LITTLE CHEF</div><div id="hero" class="hero-dishes" aria-hidden="true"></div><h1 id="welcome-title">小小廚師</h1><p>聽訂單 → 選餐點 → 送給客人<br>送對 <b>＋10</b>，送錯 <b>−10</b><br>每關完成 5 筆正確訂單！</p><button id="start" class="primary">開門營業！</button><button id="welcome-levels" class="secondary">選擇試玩關卡</button><button id="welcome-voice" class="secondary">英文聲音・試聽</button><p class="trial-note">四關都可試玩 · 不限時間 · 點訂單可重聽</p></section></div>

<script>
'use strict';
const $=id=>document.getElementById(id),TAU=Math.PI*2;
const FOODS=[['friedRice','Fried rice','炒飯'],['ramen','Ramen','拉麵'],['spaghetti','Spaghetti','義大利麵'],['pizza','Pizza','披薩'],['burger','Burger','漢堡'],['sandwich','Sandwich','三明治'],['curryRice','Curry rice','咖哩飯'],['sushi','Sushi','壽司']].map(([id,word,name])=>({id,word,name}));
const DRINKS=[['cola','Cola','可樂'],['milk','Milk','牛奶'],['orangeJuice','Orange juice','柳橙汁'],['guavaJuice','Guava juice','芭樂汁'],['appleJuice','Apple juice','蘋果汁'],['coffee','Coffee','咖啡'],['water','Water','水'],['tea','Tea','茶']].map(([id,word,name])=>({id,word,name}));
const BASES=[['rice','Rice','飯'],['noodles','Noodles','麵'],['bread','Bread','麵包']].map(([id,word,name])=>({id,word,name}));
const TOPPINGS=[['egg','Egg','蛋'],['corn','Corn','玉米'],['carrot','Carrot','胡蘿蔔'],['tomato','Tomato','番茄'],['chicken','Chicken','雞肉'],['cheese','Cheese','起司'],['lettuce','Lettuce','萵苣'],['mushroom','Mushroom','蘑菇']].map(([id,word,name])=>({id,word,name}));
const ALL=[...FOODS,...DRINKS,...BASES,...TOPPINGS],def=id=>ALL.find(d=>d.id===id);
const LEVELS=[{name:'料理點餐',icon:'🍕',english:'Food',kind:'food',need:1},{name:'飲料點餐',icon:'🥛',english:'Drinks',kind:'drink',need:1},{name:'加一種配料',icon:'🍳',english:'Mix & cook',kind:'mix',need:2},{name:'三樣小料理',icon:'🥪',english:'Little chef',kind:'mix',need:3}];
const STORE='papalab-little-chef-trial-v1';
let level=0,money=30,progress=[0,0,0,0],mistakes=0,queue=[],order=[],selected=[],options=[],phase='welcome',phaseStart=0,clock=0,last=0,deck=[],previousOrder='',reaction=null,lastReaction='',reactionCue=false,credited=false,rounds=0,sound=true,started=false,modalReturn=null,lastFocus=null,toastTimer,voice=null,voiceChoice='auto',voiceChoices={male:'auto',female:'auto'},voiceFocus=null,audioCtx=null,musicTimer=null,musicIndex=0;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function restore(){try{const s=JSON.parse(localStorage.getItem(STORE));if(s?.v!==1)return;if(Number.isFinite(s.money))money=clamp(Math.round(s.money),-99990,999990);if(Array.isArray(s.progress)&&s.progress.length===4)progress=s.progress.map(n=>Number.isFinite(n)?clamp(Math.floor(n),0,5):0);if(Number.isInteger(s.level))level=clamp(s.level,0,3);if(typeof s.sound==='boolean')sound=s.sound;if(typeof s.voiceChoice==='string'&&s.voiceChoice.length<=400)voiceChoice=s.voiceChoice;if(s.voiceChoices&&typeof s.voiceChoices==='object')for(const gender of ['male','female'])if(typeof s.voiceChoices[gender]==='string'&&s.voiceChoices[gender].length<=400)voiceChoices[gender]=s.voiceChoices[gender];}catch{}}
function save(){try{localStorage.setItem(STORE,JSON.stringify({v:1,money,progress,level,sound,voiceChoice,voiceChoices}));}catch{}}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2700)}
function voiceId(v){return v.voiceURI||v.lang+'|'+v.name;}
function englishVoices(){return 'speechSynthesis'in window?speechSynthesis.getVoices().filter(v=>/^en(?:[-_]|$)/i.test(v.lang)):[];}
function voiceScore(v){
 const name=String(v.name||''),lang=String(v.lang||'').replace('_','-').toLowerCase();let score=lang==='en-us'?45:lang==='en-gb'?35:10;
 if(/natural|neural|enhanced|premium|online.*natural/i.test(name))score+=160;
 if(/google.*(?:US English|UK English)|Samantha|Ava|Allison|Susan|Zoe|Karen|Daniel|Serena|Aria|Jenny|Guy|Christopher|Michelle|Sonia|Ryan/i.test(name))score+=65;
 if(/espeak|mbrola|whisper|zarvox|trinoids|bubbles|bells|boing|bad news|good news|microsoft (?:david|zira) desktop/i.test(name))score-=140;
 if(v.default)score+=12;if(v.localService)score+=5;return score;
}
// Web Speech 沒有統一的性別欄位：只採可信名稱線索，未知聲音可由使用者試聽指定。
function voiceGender(v){
 const name=String(v.name||'');if(v.gender==='male'||v.gender==='female')return v.gender;
 if(/\bfemale\b|女聲|女声/i.test(name))return'female';if(/\bmale\b|男聲|男声/i.test(name))return'male';
 if(/\b(Samantha|Ava|Allison|Susan|Zoe|Karen|Serena|Aria|Jenny|Michelle|Sonia|Zira|Hazel|Salli|Joanna|Kendra|Kimberly|Amy|Emma|Olivia|Moira|Tessa|Victoria|Veena|Kate|Alice|Bella|Clara)\b/i.test(name))return'female';
 if(/\b(Daniel|Alex|Fred|Thomas|Tom|Oliver|George|Arthur|Guy|Christopher|Ryan|David|Mark|James|Brian|Eric|Andrew|Steffan|Roger|Rishi|Lee|Gordon|Albert)\b/i.test(name))return'male';return null;
}
function resolveVoice(gender=null){
 const voices=englishVoices(),ranked=[...voices].sort((a,b)=>voiceScore(b)-voiceScore(a));
 if(gender==='male'||gender==='female'){
  const manual=voices.find(v=>voiceId(v)===voiceChoices[gender]);if(manual)return manual;
  const matched=ranked.find(v=>voiceGender(v)===gender);if(matched)return matched;
 }
 return voices.find(v=>voiceId(v)===voiceChoice)||ranked[0]||null;

// 吃喝共用清楚的時間軸：拿起 → 送到嘴邊 → 咬下／喝入 → 放下 → 咀嚼。
function mealMotion(a){

 const base=selected.find(id=>BASES.some(d=>d.id===id))||selected[0]||order[0]||'rice';
 const kind=level===1?'drink':['pizza','burger','sandwich','bread','sushi'].includes(base)?'hand':['ramen','spaghetti','noodles'].includes(base)?'fork':'spoon';
 const smooth=n=>{n=clamp(n,0,1);return n*n*(3-2*n);};

}

 // 肩膀、彎曲手肘與手掌跟隨餐具；食物的目的地就是嘴巴中心。
