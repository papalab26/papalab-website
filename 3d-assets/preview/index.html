<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Papa-Lab 3D 步槍兵試驗室</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf1e9;color:#32483f;font-family:system-ui,sans-serif}header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:22px}header small{display:block;color:#71857a;font-size:12px;margin-top:5px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;padding:0 18px 18px;height:calc(100dvh - 90px);min-height:500px}#stage{position:relative;border-radius:24px;overflow:hidden;background:#dce9e4}canvas{display:block;touch-action:none}aside{background:#fffcf2;border-radius:24px;padding:20px;overflow:auto}h2{font-size:15px;margin:20px 0 12px}button,select{font:inherit;border:1px solid #c9d7cc;border-radius:12px;padding:11px;background:white;color:#3c5c4b;min-height:44px;cursor:pointer}button.active{background:#44765e;color:white}.animations{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:13px;margin:12px 0 6px}select{width:100%}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}#status{font-size:13px;line-height:1.8;margin-bottom:10px}#stats{white-space:pre-line;font-size:12px;color:#76877c;line-height:1.8}.hint{position:absolute;bottom:16px;left:16px;border-radius:14px;background:#fffcebdc;padding:10px 14px;font-size:12px;pointer-events:none}#file{font-size:12px;width:100%}#error{color:#ad5e46;font-size:13px}p{font-size:12px;line-height:1.8;color:#76877c}@media(max-width:720px){.layout{display:flex;flex-direction:column;height:auto;min-height:0}#stage{height:52dvh;min-height:280px}aside{overflow:visible}header{padding:14px 18px}h1{font-size:18px}.animations{grid-template-columns:repeat(3,1fr)}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<header><h1>Papa-Lab · 3D 步槍兵<small>免費建模試驗室 · 獨立預覽，尚未整合遊戲</small></h1><span>RIFLEMAN</span></header>
<div class="layout"><section id="stage" aria-label="可旋轉的 3D 模型"><div class="hint">拖曳旋轉 · 滾輪／雙指縮放</div></section><aside><div id="status" role="status">正在載入步槍兵…</div><div id="error" role="alert"></div><div id="stats"></div><h2>切換動畫</h2><div id="animations" class="animations"></div><div class="row"><button id="pause">暫停</button><button id="restart">重新播放</button></div><label for="speed">播放速度</label><select id="speed"><option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option><option value="1.5">1.5 倍</option></select><label for="count">顯示數量</label><select id="count"><option value="1">1 名</option><option value="25">25 名</option><option value="100">100 名（測試）</option></select><div class="row"><button id="front">正面</button><button id="top">斜俯視</button></div><h2>開啟其他 GLB</h2><input id="file" type="file" accept=".glb"><p>Walk 為原地步行；真正沿道路移動由遊戲控制位置。Aim／Shoot／Hit／Death 播完會停留，切換動畫會以 0.18 秒交叉淡化。</p><p>可選 100 名檢查繪圖負載；本頁不代表所有手機效能均已驗證。</p></aside></div>
<script type="module" src="./preview.js"></script></body></html>
