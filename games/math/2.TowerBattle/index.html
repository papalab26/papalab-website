<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>鬥塔大戰 ⚔️ 人類 VS 電腦</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#08081a; font-family:'Segoe UI',Arial,sans-serif; color:#eee; }
#sw { position:absolute; top:0; left:0; transform-origin:top left; }
#gc { width:980px; background:#0e0e22; border:1px solid #252550; border-radius:14px; overflow:hidden; box-shadow:0 0 70px rgba(60,60,200,.3); }

/* ── HUD：雙列緊湊佈局（約 58px） ── */
#hud { background:#080814; border-bottom:1px solid #222244; padding:5px 14px 4px; display:flex; flex-direction:column; gap:4px; }
#hudRow1 { display:flex; align-items:center; gap:8px; }
#hudRow2 { display:flex; align-items:center; justify-content:center; gap:8px; }
.side-hud { flex:1; display:flex; align-items:center; gap:6px; min-width:0; }
.sLbl { font-size:13px; font-weight:bold; white-space:nowrap; }
.lbl-p{color:#42A5F5;} .lbl-c{color:#EF5350;}
.hp-bg { flex:1; height:12px; background:#1a1a33; border-radius:6px; border:1px solid #333; overflow:hidden; }
.hp-fill { height:100%; border-radius:6px; transition:width .25s,background .5s; }
.hp-p{background:linear-gradient(90deg,#1565C0,#64B5F6);}
.hp-c{background:linear-gradient(90deg,#B71C1C,#EF9A9A);}
.hpNum { font-size:14px; font-weight:bold; min-width:34px; }
#midTitle { display:flex; align-items:baseline; justify-content:center; gap:6px; }
.gtitle { font-size:18px; font-weight:900; letter-spacing:2px; background:linear-gradient(135deg,#42A5F5,#CE93D8,#EF5350); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; white-space:nowrap; }
#myPts { font-size:24px; font-weight:900; color:#FFD700; text-shadow:0 0 16px rgba(255,215,0,.9); }
.pts-icon{font-size:16px;}.pts-unit{font-size:13px;color:#FFD700;font-weight:bold;}
#diffTag{font-size:11px;color:#666;}
.ctrl-btn { padding:2px 9px; font-size:13px; background:rgba(255,255,255,.06); border:1px solid #444; border-radius:18px; color:#aaa; cursor:pointer; transition:all .2s; font-family:inherit; white-space:nowrap; }
.ctrl-btn:hover{background:rgba(255,255,255,.15);color:#fff;}
#pauseBtn { border-color:#F9A825; color:#F9A825; }
#pauseBtn:hover { background:rgba(249,168,37,.15); }

/* ── CANVAS ── */
#cv { display:block; width:100%; }

/* ── BOTTOM：雙欄（左數學 右出兵） ── */
#bp { background:#080814; border-top:1px solid #222244; padding:7px 14px; }
#bpRow { display:flex; gap:12px; height:148px; }
#mathSide { flex:1.25; display:flex; flex-direction:column; gap:5px; background:#0e0e22; border:1px solid #2a2a4a; border-radius:10px; padding:9px 13px; }
#unitSide { flex:1; }
#qLine { display:flex; align-items:center; justify-content:center; gap:10px; flex-shrink:0; }
#qtext { font-size:28px; font-weight:bold; color:#FFD700; text-shadow:0 0 14px rgba(255,215,0,.7); letter-spacing:2px; }
#fb { font-size:14px; padding:3px 10px; border-radius:5px; }
.fb-ok{color:#66BB6A;background:rgba(102,187,106,.18);}
.fb-no{color:#EF5350;background:rgba(239,83,80,.18);}
#choicesRow { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; flex:1; }
.cBtn { height:auto; font-size:26px; font-weight:bold; border:2px solid #3a3a6a; border-radius:10px; background:rgba(255,255,255,.05); color:#eee; cursor:pointer; transition:all .14s; font-family:inherit; touch-action:manipulation; }
.cBtn:not([disabled]):hover{background:rgba(255,215,0,.18);border-color:#FFD700;color:#FFD700;transform:translateY(-2px);}
.cBtn:not([disabled]):active{transform:scale(.96);}
.cBtn[disabled]{cursor:default;}
.cBtn.c-ok{background:rgba(76,175,80,.35)!important;border-color:#4CAF50!important;color:#A5D6A7!important;}
.cBtn.c-no{background:rgba(239,83,80,.35)!important;border-color:#EF5350!important;color:#FFCDD2!important;}

/* ── 兵種按鈕：單行顯示 ── */
#ubtns { display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); gap:6px; height:100%; }
.ub { flex-direction:row; justify-content:center; align-items:center; gap:5px; padding:0 10px; border-radius:10px; border:2px solid; background:rgba(0,0,0,.5); color:#fff; cursor:pointer; font-family:inherit; transition:all .18s; touch-action:manipulation; }
.ub:not(:disabled):hover{transform:translateY(-2px);}
.ub:not(:disabled):active{transform:scale(.97);}
.ub:disabled{opacity:.3;cursor:default;}
.ub .ico{font-size:20px;line-height:1;flex-shrink:0;}
.ub .un{font-size:13px;font-weight:bold;}
.ub .uc{font-size:12px;color:#FFD700;flex-shrink:0;}
.ub-s{border-color:#66BB6A;} .ub-s:not(:disabled):hover{background:rgba(102,187,106,.15);}
.ub-t{border-color:#42A5F5;} .ub-t:not(:disabled):hover{background:rgba(66,165,245,.15);}
.ub-a{border-color:#AB47BC;} .ub-a:not(:disabled):hover{background:rgba(171,71,188,.15);}
.ub-r{border-color:#FF7043;} .ub-r:not(:disabled):hover{background:rgba(255,112,67,.15);}
.ub.ub-locked{opacity:.38;cursor:not-allowed;filter:grayscale(.65);}
.ub.ub-locked .uc{color:#aaa;font-size:11px;}

/* ── OVERLAYS ── */
#ov{display:none;position:fixed;inset:0;justify-content:center;align-items:center;z-index:999;}
#ovbox{background:linear-gradient(135deg,#0e0e22,#181832);border:2px solid #333;border-radius:16px;padding:46px 72px;text-align:center;box-shadow:0 0 80px rgba(60,60,200,.4);}
#ovtitle{font-size:52px;font-weight:900;margin-bottom:14px;}
#ovmsg{font-size:20px;color:#888;margin-bottom:28px;}
#restBtn{padding:13px 55px;background:linear-gradient(135deg,#F9A825,#E65100);color:#000;border:none;border-radius:10px;font-size:20px;font-weight:bold;cursor:pointer;transition:all .2s;}
#restBtn:hover{filter:brightness(1.12);transform:scale(1.05);}
#diffOv{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.93);justify-content:center;align-items:center;z-index:998;}
#diffBox{background:linear-gradient(135deg,#0e0e22,#181832);border:2px solid #2a2a50;border-radius:18px;padding:46px 55px;text-align:center;box-shadow:0 0 80px rgba(60,60,200,.4);width:540px;}
.diff-title{font-size:40px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#42A5F5,#CE93D8,#EF5350);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.diff-sub{font-size:16px;color:#777;margin-bottom:32px;}
#diffBtns{display:flex;gap:18px;justify-content:center;}
.dBtn{flex:1;padding:22px 14px;border:2px solid;border-radius:14px;background:rgba(0,0,0,.4);color:#fff;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px;touch-action:manipulation;}
.dBtn:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.6);}
.dBtn:active{transform:scale(.97);}
.dBtn-e{border-color:#42A5F5;}.dBtn-e:hover{background:rgba(66,165,245,.18);}
.dBtn-h{border-color:#AB47BC;}.dBtn-h:hover{background:rgba(171,71,188,.18);}
.dIco{font-size:40px;}.dLv{font-size:12px;color:#888;margin-top:2px;}.dName{font-size:21px;font-weight:bold;}
.dRange{font-size:25px;font-weight:900;margin:4px 0;}.dRange-e{color:#42A5F5;}.dRange-h{color:#CE93D8;}
.dDesc{font-size:13px;color:#777;line-height:1.6;}

/* ── 暫停覆層 ── */
#pauseOv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);justify-content:center;align-items:center;z-index:997;}
#pauseBox{background:linear-gradient(135deg,#0e0e22,#181832);border:2px solid #3a3a60;border-radius:18px;padding:44px 68px;text-align:center;box-shadow:0 0 60px rgba(60,60,200,.4);}
.pause-title{font-size:34px;font-weight:900;color:#FFD700;margin-bottom:26px;}
.pause-btns{display:flex;gap:14px;justify-content:center;}
.pbtn{padding:12px 36px;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;transition:all .2s;font-family:inherit;}
.pbtn-resume{background:linear-gradient(135deg,#1565C0,#42A5F5);color:#fff;}
.pbtn-resume:hover{filter:brightness(1.15);transform:scale(1.04);}
.pbtn-quit{background:rgba(255,255,255,.08);border:1px solid #555;color:#aaa;}
.pbtn-quit:hover{background:rgba(255,255,255,.15);color:#fff;}

/* Touch layouts keep controls readable instead of scaling the entire page. */
button { touch-action:manipulation; }
button:focus-visible { outline:3px solid #FFD700; outline-offset:3px; }
#diffOv,#pauseOv,#ov { overflow:auto; padding:16px; }
#diffBox,#pauseBox,#ovbox { max-width:100%; }
@media (max-width:980px) {
  html,body { overflow:auto; height:auto; min-height:100%; }
  body { padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #sw { position:relative; transform:none!important; width:100%; }
  #gc { width:100%; border-radius:0; }
  #hud { padding:8px; }
  #hudRow1 { flex-wrap:wrap; gap:6px; }
  #midTitle { order:-1; flex-basis:100%; }
  .side-hud { flex-basis:45%; }
  #hudRow2 { flex-wrap:wrap; }
  .ctrl-btn { min-height:44px; padding:6px 12px; }
  #bp { padding:8px; }
  #bpRow { height:auto; gap:8px; }
  #mathSide { padding:8px; min-width:0; }
  #unitSide { min-width:0; }
  #qtext { font-size:24px; }
  #qLine { flex-wrap:wrap; gap:4px; }
  .cBtn { min-height:48px; font-size:24px; }
  .ub { display:flex; flex-wrap:wrap; min-height:48px; padding:6px; gap:3px; }
  .ub .uc { flex-basis:100%; }
  #diffBox,#pauseBox,#ovbox { padding:24px 16px; }
  .diff-title { font-size:30px; }
  .diff-sub { margin-bottom:18px; }
  #diffBtns { gap:10px; }
  .dBtn { min-width:0; padding:16px 8px; }
  .dName { font-size:18px; }
  .pause-btns { flex-wrap:wrap; }
  .pbtn,#restBtn { min-height:48px; }
  #ovtitle { font-size:34px; }
}
@media (max-width:600px) and (orientation:portrait) {
  #bpRow { flex-direction:column; }
  #ubtns { grid-template-columns:repeat(2,1fr); }
  .ub .uc { flex-basis:auto; }
  #mathSide { gap:8px; }
  .cBtn { min-height:56px; }
}

<body>
<div id="sw"><div id="gc">

  <!-- ── HUD ── -->
  <div id="hud">
    <div id="hudRow1">
      <div class="side-hud">
        <span class="sLbl lbl-p">🏰 人類</span>

        <span class="hpNum lbl-p" id="pHpN">1000</span>
      </div>
      <div id="midTitle">

      </div>
      <div class="side-hud" style="justify-content:flex-end">
        <span class="hpNum lbl-c" id="cHpN">1000</span>
        <div class="hp-bg"><div class="hp-fill hp-c" id="cHpB" style="width:100%"></div></div>

</div></div>

    </div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════
//  RESPONSIVE SCALING
// ═══════════════════════════════════════════════════════════
function scaleGame(){
  const sw=document.getElementById('sw'),gc=document.getElementById('gc');
  if(window.innerWidth<=980){sw.style.transform='none';return;}
  const gw=980,gh=gc.offsetHeight||545,vw=window.innerWidth,vh=window.innerHeight;
  const s=Math.min(vw/gw,vh/gh);
  const tx=Math.max(0,(vw-gw*s)/2),ty=Math.max(0,(vh-gh*s)/2);
  sw.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
}
window.addEventListener('resize',scaleGame);
setTimeout(scaleGame,60);

function toggleFS(){
  try{
    const el=document.documentElement;
    if(!document.fullscreenElement&&!document.webkitFullscreenElement)
      Promise.resolve((el.requestFullscreen||el.webkitRequestFullscreen).call(el)).catch(()=>{});
    else Promise.resolve((document.exitFullscreen||document.webkitExitFullscreen).call(document)).catch(()=>{});
  }catch(e){}
}

function sfx(type,ms=80){

  const now=Date.now();

  try{
    const a=getAC();
    if(type==='bullet')   _sBullet(a);
    else if(type==='cannon')   _sCannon(a);
    else if(type==='bomb')     _sBomb(a);
    else if(type==='missile')  _sMissile(a);
    else if(type==='laser')    _sLaser(a);
    else if(type==='boom')     _sBoom(a);
    else if(type==='ok')       _sOk(a);

    else if(type==='victory')  _sVictory(a);
    else if(type==='defeat')   _sDefeat(a);

}

// ── 背景音樂（C 大調可愛風，三角波撥弦，20 秒） ──
const BG_MELODY=[
  [523,.25],[392,.25],[659,.25],[392,.25],[440,.25],[349,.25],[440,.25],[523,.25],
  [392,.25],[330,.25],[392,.25],[494,.25],[523,.5],[0,.5],
  [587,.25],[440,.25],[698,.25],[440,.25],[523,.25],[392,.25],[659,.25],[392,.25],
  [349,.25],[262,.25],[349,.25],[440,.25],[392,.5],[0,.5],
  [659,.25],[523,.25],[784,.25],[523,.25],[523,.25],[392,.25],[659,.25],[523,.25],
  [392,.25],[523,.25],[659,.25],[784,.25],[784,.5],[0,.5],
  [440,.25],[330,.25],[440,.25],[523,.25],[392,.25],[294,.25],[392,.25],[494,.25],
  [349,.25],[262,.25],[440,.25],[349,.25],[392,.25],[392,.25],[0,.5],
  [523,.25],[659,.25],[784,.25],[659,.25],[523,.25],[440,.25],[698,.25],[440,.25],
  [392,.25],[494,.25],[587,.25],[494,.25],[523,.75],[0,.25],
];
function trackBgSource(source,nodes=[]){
  const voice={source,nodes};bgSources.add(voice);
  source.onended=()=>{bgSources.delete(voice);for(const node of [source,...nodes]){try{node.disconnect();}catch(e){}}};
  return source;
}
function startBgMusic(){
  if(bgRunning||muted||!running||paused)return;
  try{
    const a=getAC();bgGain=a.createGain();bgGain.gain.value=1;bgGain.connect(a.destination);
    bgRunning=true;bgIndex=0;bgNextAt=a.currentTime+.04;bgNextBeatAt=bgNextAt;_bgLoop();
  }catch(e){stopBgMusic();}
}
function stopBgMusic(){
  bgRunning=false;
  // Disconnect this session before clearing nodes, so restarting cannot revive old notes.
  if(bgGain){try{bgGain.gain.cancelScheduledValues(AC.currentTime);bgGain.gain.value=0;bgGain.gain.setValueAtTime(0,AC.currentTime);bgGain.disconnect();}catch(e){}bgGain=null;}
  for(const {source,nodes} of bgSources){try{source.stop(AC.currentTime);}catch(e){}for(const node of [source,...nodes]){try{node.disconnect();}catch(e){}}}
  bgSources.clear();
}
function _bgLoop(){
  if(!bgRunning||muted||paused||!running)return;
  try{
    const a=AC,bg=bgGain;if(!a||a.state!=='running'||!bg)return;
    const horizon=a.currentTime+.16;
    if(bgNextAt<a.currentTime)bgNextAt=a.currentTime+.025;
    while(bgNextAt<horizon){
      const [fr,dur]=BG_MELODY[bgIndex],at=bgNextAt;
      if(fr>0){
        const mo=a.createOscillator(),mg=a.createGain(),vib=a.createOscillator(),vibg=a.createGain();
        trackBgSource(mo,[mg]);trackBgSource(vib,[vibg]);
        mo.type='triangle';mo.frequency.value=fr;vib.type='sine';vib.frequency.value=5.5;vibg.gain.value=3;vib.connect(vibg);vibg.connect(mo.frequency);
        mo.connect(mg);mg.connect(bg);mg.gain.setValueAtTime(0,at);mg.gain.linearRampToValueAtTime(.065,at+.015);mg.gain.exponentialRampToValueAtTime(.025,at+dur*.6);mg.gain.exponentialRampToValueAtTime(.001,at+dur*.95);
        mo.start(at);mo.stop(at+dur+.04);vib.start(at);vib.stop(at+dur+.04);
        if(bgIndex%4===0){const bass=a.createOscillator(),gain=a.createGain();trackBgSource(bass,[gain]);bass.type='sine';bass.frequency.value=fr*.5;bass.connect(gain);gain.connect(bg);gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.09,at+.02);gain.gain.exponentialRampToValueAtTime(.001,at+.75);bass.start(at);bass.stop(at+.85);}
      }
      bgNextAt+=dur;bgIndex=(bgIndex+1)%BG_MELODY.length;
    }
    if(!bgTickBuffer){bgTickBuffer=a.createBuffer(1,a.sampleRate*.035|0,a.sampleRate);const data=bgTickBuffer.getChannelData(0);for(let k=0;k<data.length;k++)data[k]=Math.random()*2-1;}
    if(bgNextBeatAt<a.currentTime)bgNextBeatAt=a.currentTime+.025;
    while(bgNextBeatAt<horizon){
      const tick=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain(),at=bgNextBeatAt;
      trackBgSource(tick,[filter,gain]);tick.buffer=bgTickBuffer;filter.type='highpass';filter.frequency.value=7000;gain.gain.setValueAtTime(.04,at);gain.gain.exponentialRampToValueAtTime(.001,at+.03);tick.connect(filter);filter.connect(gain);gain.connect(bg);tick.start(at);tick.stop(at+.04);bgNextBeatAt+=.5;
    }
  }catch(e){stopBgMusic();}
}

let questionBag=[],recentQuestionKeys=[];
function questionBank(){
  const minimum=currentLevel===0?2:difficulty==='easy'?2:11;
  const maximum=currentLevel===0?5:difficulty==='easy'?10:20;
  const bank=[];for(let sum=minimum;sum<=maximum;sum++)for(let a=1;a<sum;a++)bank.push({a,b:sum-a,sum,key:[a,sum-a].sort((x,y)=>x-y).join('+')});
  return bank;
}
function newQ(){
  const bank=questionBank();
  if(!questionBag.length){questionBag=[...bank];shuffle(questionBag);}
  let index=questionBag.findIndex(q=>!recentQuestionKeys.includes(q.key));
  if(index<0)index=questionBag.findIndex(q=>q.key!==recentQuestionKeys.at(-1));
  let q;
  if(index>=0)q=questionBag.splice(index,1)[0];
  else {const alternatives=bank.filter(q=>q.key!==recentQuestionKeys.at(-1));q=alternatives[ri(0,alternatives.length-1)];}
  recentQuestionKeys.push(q.key);if(recentQuestionKeys.length>3)recentQuestionKeys.shift();
  const {a,b,sum}=q;
  const choices=makeChoices(sum);
  curQ={a,b,key:q.key,ans:sum,choices,locked:false};
  document.getElementById('qtext').textContent=`${a} + ${b} = ?`;
  document.getElementById('fb').textContent='';document.getElementById('fb').className='';
  [0,1,2,3].forEach(i=>{const btn=document.getElementById('c'+i);btn.textContent=choices[i];btn.disabled=false;btn.className='cBtn';});
}
function makeChoices(ans){
  const max=currentLevel===0?5:difficulty==='easy'?10:20;
  const min=currentLevel===0||difficulty==='easy'?1:11;
  const used=new Set([ans]);
  const offsets=[1,2,3,4,-1,-2,-3,-4];shuffle(offsets);
  for(const offset of offsets){const wrong=ans+offset;if(wrong>=min&&wrong<=max)used.add(wrong);if(used.size===4)break;}
  if(used.size<4){const remaining=Array.from({length:max-min+1},(_,i)=>i+min).filter(n=>!used.has(n));shuffle(remaining);for(const n of remaining){used.add(n);if(used.size===4)break;}}
  const all=[...used];shuffle(all);return all;
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}
function choose(idx){
  if(!running||paused||curQ.locked||document.getElementById('c'+idx).disabled)return;
  curQ.locked=true;
  const btns=[0,1,2,3].map(i=>document.getElementById('c'+i));
  btns.forEach(b=>b.disabled=true);
  const fb=document.getElementById('fb'),ci=curQ.choices.indexOf(curQ.ans);
  if(curQ.choices[idx]===curQ.ans){const reward=LEVELS[currentLevel].answerPoints||1;pPts+=reward;correctCount++;btns[idx].classList.add('c-ok');fb.textContent=`✓ 正確！+${reward} 點`;fb.className='fb-ok';sfx('ok',0);redraw();questionDelay=480;}
  else if(currentLevel===0){curQ.locked=false;btns.forEach((button,i)=>button.disabled=i===idx||button.classList.contains('c-no'));btns[idx].classList.add('c-no');fb.textContent='再想一想，你可以的！';fb.className='fb-no';sfx('no',0);}
  else{btns[idx].classList.add('c-no');btns[ci].classList.add('c-ok');fb.textContent=`✗ 答案是 ${curQ.ans}`;fb.className='fb-no';sfx('no',0);questionDelay=1000;}
}

// ═══════════════════════════════════════════════════════════
//  UNIT MANAGEMENT
// ═══════════════════════════════════════════════════════════
function playerUnlocked(type){return currentLevel+1>=UNLOCK[type];}
function cpuUnlocked(type){return currentLevel+1>=UNLOCK[type];}
function buy(type){
  if(!running||prepPhase||paused)return;
  if(!playerUnlocked(type))return;
  const d=UDEFS[type];if(pPts<d.cost)return;
  pPts-=d.cost;spawn(type,'player');redraw();
}
function spawn(type,side){
  if(!(side==='player'?playerUnlocked(type):cpuUnlocked(type)))return;
  const d=UDEFS[type],isP=side==='player';
  const x=isP?P_SPAWN:C_SPAWN,y=d.fly?(GY-d.fh-d.sz):(GY-d.sz);
  units.push({id:uid++,type,side,x,y,hp:d.hp,mhp:d.hp,spd:isP?d.spd:-d.spd,range:d.range,cd:d.cd,timer:0,dmg:d.dmg,ps:isP?d.ps:-d.ps,pt:d.pt,sz:d.sz,fly:d.fly,
    state:'walk',animFrame:0,animTick:0,artTick:0,fireAnim:0,foy:d.foy??0.5});
}
function nearest(u){
  const canHitAir=(u.type==='airplane'||u.type==='robot');
  let best=null,bd=Infinity;
  for(const e of units){
    if(e.side===u.side)continue;
    if(e.state==='die')continue; // 陣亡動畫中無法作為目標
    if(e.fly&&!canHitAir)continue;
    const d=Math.abs((e.x+e.sz/2)-(u.x+u.sz/2));
    if(d<bd){bd=d;best=e;}
  }
  return best;
}

// ═══════════════════════════════════════════════════════════
//  CPU AI ── 累積金幣後隨機出兵（與玩家同樣機制，但自動）
// ═══════════════════════════════════════════════════════════
function cpuSolveSeconds(q){
  const base=q.sum<=5&&Math.max(q.a,q.b)<=3?3:q.sum<=10?4:q.a>=5&&q.b>=5?5.5:5;
  return base*(.9+Math.random()*.2);
}
function nextCpuQuestion(){
  const bank=questionBank();
  if(!cpuQuestionBag.length){cpuQuestionBag=[...bank];shuffle(cpuQuestionBag);}
  const index=cpuQuestionBag.findIndex(q=>q.key!==cpuPreviousKey);
  const q=index>=0?cpuQuestionBag.splice(index,1)[0]:bank.filter(q=>q.key!==cpuPreviousKey)[ri(0,bank.filter(q=>q.key!==cpuPreviousKey).length-1)];
  cpuQuestion={...q,seconds:cpuSolveSeconds(q)};cpuPreviousKey=q.key;cpuSolveLeft=cpuQuestion.seconds*60;
}
function tickCpuQuestion(){
  if(!cpuQuestion)return;
  cpuSolveLeft--;
  if(cpuSolveLeft<=0){cPts++;cpuTotalCoins++;cpuAnswerCount++;cpuLastSolved={...cpuQuestion};nextCpuQuestion();}
}
function refillCpuPlan(){
  const order=['soldier','tank','airplane','robot'];
  cpuPlanQueue=['soldier','soldier','tank','tank','airplane','airplane','robot'].filter(cpuUnlocked);shuffle(cpuPlanQueue);
  if(cpuSpawnCount===0){
    const soldier=cpuPlanQueue.indexOf('soldier');cpuPlanQueue.splice(soldier,1);cpuPlanQueue.unshift('soldier');
    const newest=order[currentLevel];
    if(newest!=='soldier'){cpuPlanQueue.splice(cpuPlanQueue.indexOf(newest),1);cpuPlanQueue.splice(1,0,newest);}
  }else if(cpuPlanQueue[0]===cpuPurchaseHistory.at(-1)){
    const alternate=cpuPlanQueue.findIndex(type=>type!==cpuPlanQueue[0]);
    if(alternate>0)[cpuPlanQueue[0],cpuPlanQueue[alternate]]=[cpuPlanQueue[alternate],cpuPlanQueue[0]];
  }
}
function cpuAI(){
  if(!running||paused||prepPhase)return;
  if(currentLevel===0&&units.filter(u=>u.side==='cpu'&&u.hp>0).length>=2)return;
  if(!cpuPlanQueue.length)refillCpuPlan();
  // React to aircraft with an available anti-air unit; otherwise save for the planned purchase.
  if(cpuUnlocked('airplane')&&units.some(u=>u.side==='player'&&u.fly&&u.hp>0)&&!units.some(u=>u.side==='cpu'&&(u.fly||u.type==='robot')&&u.hp>0)&&!['airplane','robot'].includes(cpuPlanQueue[0])){
    const plane=cpuPlanQueue.indexOf('airplane');if(plane>=0){cpuPlanQueue.splice(plane,1);cpuPlanQueue.unshift('airplane');}
  }
  const type=cpuPlanQueue[0],cost=UDEFS[type].cost;
  if(cPts<cost)return;
  cPts-=cost;spawn(type,'cpu');cpuSpawnCount++;cpuPlanQueue.shift();cpuPurchaseHistory.push(type);
  if(cpuPurchaseHistory.length>40)cpuPurchaseHistory.shift();
}

// ═══════════════════════════════════════════════════════════
//  PROJECTILE
// ═══════════════════════════════════════════════════════════
function fire(u,tx,ty,ptOverride){
  const pt=ptOverride||u.pt,isP=u.side==='player';
  const sx=isP?(u.x+u.sz+2):(u.x-4),sy=u.y+u.sz*(u.foy??0.5);
  if(pt==='laser'){efx.push({k:'laser',x1:sx,y1:sy,x2:tx,y2:ty,life:14,max:14});return null;}
  const dx=tx-sx,dy=ty-sy,dist=Math.hypot(dx,dy)||1,spd=Math.abs(u.ps);
  let vx,vy,gv=0;
  if(pt==='missile'){vx=isP?spd*1.3:-spd*1.3;vy=0;}
  else if(pt==='bomb'){vx=(dx/dist)*spd*.85;vy=-2.8;gv=.27;}
  else if(pt==='bullet'){vx=isP?spd:-spd;vy=0;}
  else{vx=(dx/dist)*spd;vy=(dy/dist)*spd;}
  return{x:sx,y:sy,vx,vy,gv,type:pt,dmg:u.dmg,side:u.side};
}
function boom(x,y,r=18){efx.push({k:'boom',x,y,r,life:26,max:26});sfx('boom',60);}
function castleHit(hx,hy){
  const cols=['#795548','#8D6E63','#A1887F','#546E7A','#607D8B','#4E342E'];
  for(let i=0;i<7;i++){
    const ang=-Math.PI*.9+Math.random()*Math.PI*.8,spd=1.5+Math.random()*3.5;
    debrisArr.push({x:hx+(Math.random()-.5)*18,y:hy,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1.5,
      life:30+Math.random()*30|0,max:60,sz:2+Math.random()*5|0,
      col:cols[Math.floor(Math.random()*cols.length)],smoke:false});
  }
}
function spawnSmoke(castleX,hp){
  const top=GY-CH,cnt=hp<levelCastleHP(castleX===C_CX?'cpu':'player')*.3?3:1;
  for(let i=0;i<cnt;i++){
    debrisArr.push({x:castleX+8+Math.random()*72,y:top+10+Math.random()*80,
      vx:(Math.random()-.5)*.4,vy:-.6-Math.random()*.8,
      life:80+Math.random()*40|0,max:120,sz:6+Math.random()*12,col:null,smoke:true});
  }
}

// ═══════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════
function update(){
  if(!running||paused)return;

  tickCpuQuestion(); // 電腦和玩家都可在備戰時答題存點數
  // 準備期倒數
  if(prepPhase){
    prepFrames++;
    if(prepFrames>=PREP_DUR){prepPhase=false;sfx('go',0);}
    efx=efx.filter(e=>--e.life>0);
    return;
  }

  gameFrames++;
  // CPU 出兵決策（第一關保留較慢節奏，其他關約 3～5 秒）
  if(++cpuSpendTimer>=cpuSpendInterval){cpuSpendTimer=0;cpuSpendInterval=cpuSpendDelay();cpuAI();}
  // 受損城堡產生煙霧
  if(gameFrames%40===0){
    if(pHP<levelCastleHP()*.7)spawnSmoke(P_CX,pHP);
    if(cHP<levelCastleHP('cpu')*.7)spawnSmoke(C_CX,cHP);
  }

  // ── Unit update ──
  for(let i=units.length-1;i>=0;i--){
    const u=units[i];
    // ── 死亡動畫進行中（state==='die'）──
    if(u.state==='die'){
      u.animTick++;
      if(u.animTick>=S_TPF){u.animTick=0;u.animFrame++;}
      if(u.animFrame>=S_DIE_COLS){boom(u.x+u.sz/2,u.y+u.sz/2,u.sz*.75);units.splice(i,1);}
      continue;
    }
    // ── HP 歸零：切入死亡或立即移除 ──
    if(u.hp<=0){
      if(u.type==='soldier'){u.state='die';u.animFrame=0;u.animTick=0;sfx('soldierDie',200);continue;}
      else{sfx('unitDie',200);boom(u.x+u.sz/2,u.y+u.sz/2,u.sz*.75);units.splice(i,1);continue;}
    }
    u.artTick++;if(u.fireAnim>0)u.fireAnim--;
    // ── 動畫幀更新（走路/攻擊） ──
    u.animTick++;if(u.animTick>=S_TPF){u.animTick=0;u.animFrame=(u.animFrame+1)%S_COLS;}
    const isP=u.side==='player';
    const en=nearest(u);let did=false;
    if(en){
      const dist=Math.abs((en.x+en.sz/2)-(u.x+u.sz/2));
      if(dist<=u.range){
        did=true;u.timer++;
        if(u.timer>=u.cd){
          u.timer=0;u.fireAnim=12;
          const tx=en.x+en.sz/2,ty=en.y+en.sz/2;
          const usePt=(u.type==='airplane'&&en.fly)?'missile':u.pt;
          if(usePt==='laser'){const ly=u.y+u.sz*(u.foy??0.5);en.hp-=u.dmg;efx.push({k:'laser',x1:isP?u.x+u.sz:u.x,y1:ly,x2:tx,y2:ty,life:14,max:14});sfx('laser');}
          else{const p=fire(u,tx,ty,usePt);if(p){projs.push(p);sfx(usePt);}}
        }
      }
    }
    if(!did){
      const cx=isP?C_CX:P_CX,cd2=Math.abs(cx+CW/2-(u.x+u.sz/2));
      if(cd2<=u.range){
        did=true;u.timer++;
        if(u.timer>=u.cd){
          u.timer=0;u.fireAnim=12;
          const tx=cx+CW/2,ty=GY-CH/2;
          const usePt=u.type==='airplane'?'bomb':u.pt;
          if(usePt==='laser'){const ly=u.y+u.sz*(u.foy??0.5);if(isP){cHP-=u.dmg;castleHit(tx,ty);}else{pHP-=u.dmg;castleHit(tx,ty);}efx.push({k:'laser',x1:isP?u.x+u.sz:u.x,y1:ly,x2:tx,y2:ty,life:14,max:14});sfx('laser');redraw();}
          else{const p=fire(u,tx,ty,usePt);if(p){projs.push(p);sfx(usePt);}}
        }
      }else{u.x+=u.spd;u.timer=Math.max(0,u.timer-1);}
    }
    // ── 動畫狀態更新 ──
    u.state=did?'attack':'walk';
  }

  // ── Projectile update ──
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];
    p.x+=p.vx;p.y+=p.vy;if(p.gv)p.vy+=p.gv;
    if(p.type==='bomb'&&p.y>=GY){
      boom(p.x,GY,30);
      const bR=70;
      for(let j=units.length-1;j>=0;j--){const u=units[j];if(u.side===p.side||u.fly)continue;if(Math.abs(u.x+u.sz/2-p.x)<bR)u.hp-=p.dmg;}
      if(p.side==='player'&&Math.abs(p.x-(C_CX+CW/2))<CW/2+bR){cHP=Math.max(0,cHP-p.dmg);castleHit(p.x,GY);redraw();}
      if(p.side==='cpu'&&Math.abs(p.x-(P_CX+CW/2))<CW/2+bR){pHP=Math.max(0,pHP-p.dmg);castleHit(p.x,GY);redraw();}
      projs.splice(i,1);continue;
    }
    if(p.x<-30||p.x>W+30||p.y>H+60){projs.splice(i,1);continue;}
    let hit=false;
    for(let j=units.length-1;j>=0;j--){
      const u=units[j];if(u.side===p.side)continue;
      if(u.state==='die')continue; // 陣亡動畫中不再受到傷害
      if(p.type==='missile'&&!u.fly)continue;
      if(p.type!=='missile'&&p.type!=='laser'&&u.fly)continue;
      if(Math.hypot(p.x-(u.x+u.sz/2),p.y-(u.y+u.sz/2))<u.sz/2+7){u.hp-=p.dmg;boom(p.x,p.y,13);projs.splice(i,1);hit=true;break;}
    }
    if(hit)continue;
    if(p.type!=='bomb'){
      if(p.side==='player'&&p.x>=C_CX&&p.x<=C_CX+CW&&p.y>=GY-CH&&p.y<=GY){cHP-=p.dmg;boom(p.x,p.y,20);castleHit(p.x,p.y);projs.splice(i,1);redraw();continue;}
      if(p.side==='cpu'&&p.x>=P_CX&&p.x<=P_CX+CW&&p.y>=GY-CH&&p.y<=GY){pHP-=p.dmg;boom(p.x,p.y,20);castleHit(p.x,p.y);projs.splice(i,1);redraw();continue;}
    }
  }

  efx=efx.filter(e=>--e.life>0);
  if(pHP<=0||cHP<=0){pHP=Math.max(0,pHP);cHP=Math.max(0,cHP);redraw();running=false;stopBgMusic();questionDelay=0;const playerWon=cHP<=0;endTimer=setTimeout(()=>{endTimer=null;gameOver(playerWon);},800);}
}

function drawLandscape(){
  const sky=ctx.createLinearGradient(0,0,0,GY);
  sky.addColorStop(0,'#acdff1');sky.addColorStop(1,'#e8f7e9');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff1ad';ctx.beginPath();ctx.arc(790,48,27,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff1ad';ctx.lineWidth=3;
  for(let i=0;i<12;i++){const a=i*Math.PI/6;ctx.beginPath();ctx.moveTo(790+Math.cos(a)*34,48+Math.sin(a)*34);ctx.lineTo(790+Math.cos(a)*40,48+Math.sin(a)*40);ctx.stroke();}
  for(const [x,y,k] of [[160,48,1],[350,28,.75],[650,65,1.1],[860,110,.65]]){
    ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.fillStyle='#ffffffc9';
    ctx.beginPath();ctx.ellipse(0,8,43,13,0,0,Math.PI*2);ctx.ellipse(-17,0,19,17,0,0,Math.PI*2);ctx.ellipse(9,-4,24,23,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  for(const [y,color] of [[185,'#b3dac2'],[213,'#8ec8ab']]){
    ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,GY);
    ctx.bezierCurveTo(130,y-45,220,y-45,350,GY-25);
    ctx.bezierCurveTo(490,y-45,660,y-35,740,GY-25);
    ctx.bezierCurveTo(850,y-45,930,y-45,W,GY-15);
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#80b777';ctx.fillRect(0,GY-4,W,H-GY+4);
  ctx.fillStyle='#eddbad';ctx.fillRect(0,GY+2,W,23);
  ctx.fillStyle='#f8e9c9';ctx.fillRect(0,GY+4,W,3);
  for(let x=110;x<W-90;x+=37){
    ctx.fillStyle=x%2?'#c4d58d':'#acd382';ctx.beginPath();ctx.ellipse(x,GY+38,3,2,0,0,Math.PI*2);ctx.fill();
    if(x%3===0){ctx.fillStyle='#fff5c9';ctx.beginPath();ctx.arc(x+9,GY+35,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#edb76f';ctx.beginPath();ctx.arc(x+9,GY+35,1,0,Math.PI*2);ctx.fill();}
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawLandscape();

  efx.filter(e=>e.k==='laser').forEach(drawLaser);
  drawCastle(P_CX,'player',pHP);
  drawCastle(C_CX,'cpu',cHP);
  units.forEach(drawUnit);
  projs.forEach(drawProj);
  efx.filter(e=>e.k==='boom').forEach(drawBoom);

  // ── 煙火粒子（勝利時） ──
  if(fwp.length){
    fwp.forEach(p=>{
      const a=p.life/p.max;
      ctx.save();ctx.globalAlpha=a*.92;
      ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=9;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
  }

  // ── 磚塊碎片 & 煙霧 ──
  debrisArr.forEach(d=>{
    ctx.save();
    if(d.smoke){
      const a=(d.life/d.max)*.5,sz=d.sz*(1.2+(1-d.life/d.max)*1.8);
      ctx.globalAlpha=a;ctx.fillStyle='#aaa';
      ctx.beginPath();ctx.arc(d.x,d.y,sz,0,Math.PI*2);ctx.fill();
    }else{
      ctx.globalAlpha=Math.min(1,d.life/d.max*2);
      ctx.fillStyle=d.col;ctx.fillRect(d.x-d.sz/2,d.y-d.sz/2,d.sz,d.sz);
    }
    ctx.restore();
  });

  // ── 準備期倒數圓形 ──
  if(prepPhase&&running){
    const remaining=Math.ceil((PREP_DUR-prepFrames)/60),isUrgent=remaining<=5;
    ctx.save();
    ctx.beginPath();ctx.arc(W/2,110,58,0,Math.PI*2);ctx.fillStyle='rgba(255,253,246,.95)';ctx.fill();
    const prog=(PREP_DUR-prepFrames)/PREP_DUR;
    ctx.beginPath();ctx.arc(W/2,110,58,-Math.PI/2,-Math.PI/2+prog*Math.PI*2);ctx.strokeStyle=isUrgent?'#d77867':'#66a7b6';ctx.lineWidth=5;ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 46px "Segoe UI"';ctx.fillStyle=isUrgent?'#bb655b':'#37677b';
    if(isUrgent){ctx.shadowColor='#FF5252';ctx.shadowBlur=18;}
    ctx.fillText(remaining,W/2,108);ctx.shadowBlur=0;
    ctx.font='bold 14px "Segoe UI"';ctx.fillStyle='#355d64';ctx.fillText('秒後電腦開始進攻！',W/2,182);
    ctx.font='12px "Segoe UI"';ctx.fillStyle='#456d65';ctx.fillText('快答題累積點數！（此時無法出兵）',W/2,200);
    ctx.restore();
  }
}

// ── Castle ─────────────────────────────────────────────────

  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x,top,CW,CH,[8,8,0,0]);ctx.fill();
  ctx.fillStyle=isP?'#d3e8ef':'#ffe0cc';ctx.fillRect(x,top+8,CW,6);
  ctx.fillStyle='#ffffff55';ctx.fillRect(x+4,top+17,4,CH-20);

  const bW=14,bH=18;for(let i=0;i<6;i++){if(i%2===0){ctx.fillStyle=cb;ctx.fillRect(x+i*bW,top-bH,bW,bH);}}
  for(let r=0;r<3;r++){for(let c=0;c<2;c++){const wx=x+11+c*33,wy=top+26+r*52;ctx.fillStyle='rgba(255,200,80,.12)';ctx.fillRect(wx-3,wy-3,18,24);ctx.fillStyle='#fff1b4';ctx.beginPath();ctx.roundRect(wx,wy,12,18,[6,6,0,0]);ctx.fill();ctx.strokeStyle=isP?'#6b99b0':'#bd8c82';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(wx+6,wy+2);ctx.lineTo(wx+6,wy+18);ctx.moveTo(wx,wy+9);ctx.lineTo(wx+12,wy+9);ctx.stroke();}}
  const gx=x+(CW-20)/2;ctx.fillStyle='#607b88';ctx.fillRect(gx,GY-50,20,50);ctx.beginPath();ctx.arc(gx+10,GY-50,10,Math.PI,0);ctx.fill();
  ctx.strokeStyle='#96a9af';ctx.lineWidth=2;for(let b=0;b<4;b++){ctx.beginPath();ctx.moveTo(gx+3+b*5,GY-48);ctx.lineTo(gx+3+b*5,GY);ctx.stroke();}
  const fpx=isP?x+CW-9:x+9,fpy=top-bH-30;ctx.strokeStyle='#999';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fpx,fpy);ctx.lineTo(fpx,fpy+30);ctx.stroke();
  const fd=isP?1:-1;ctx.fillStyle=flagC;ctx.beginPath();ctx.moveTo(fpx,fpy);ctx.lineTo(fpx+fd*24,fpy+7);ctx.lineTo(fpx,fpy+14);ctx.closePath();ctx.fill();

  // 火焰效果（動態，依受損程度增強）
  if(hp<levelCastleHP(side)*.75){

}

// ── Units ──────────────────────────────────────────────────
// ── 士兵精靈圖動畫 ─────────────────────────────────────────
// 精靈規格：10 cols × 3 rows
//   Row 0 = Walk (10f)  Row 1 = Attack (10f)  Row 2 = Die (10f)
//   sw = Math.round(naturalWidth/10)  sh = Math.round(naturalHeight/3)
const S_COLS=10,S_ROWS=3,S_TPF=6,S_DIE_COLS=10; // S_TPF: ticks per anim frame
// 死亡動畫每格偏移（精靈座標系，10 格後倒動畫）
// dy 全部設 0：精靈 frame 本身已包含倒地視覺，手動加 dy 會穿透地面
// dx 負值 = 向左位移（後倒方向，精靈面朝右）；CPU 陣營翻轉後自動向右倒
// 可自行微調 dx 數值
const deathOffsets=[
  {dx:   0, dy: 0},  // frame 0：中彈瞬間
  {dx:  -3, dy: 0},  // frame 1：開始後仰
  {dx:  -6, dy: 0},  // frame 2：失去重心
  {dx: -10, dy: 0},  // frame 3：快速後倒
  {dx: -13, dy: 0},  // frame 4：繼續倒下
  {dx: -16, dy: 0},  // frame 5：接近地面
  {dx: -18, dy: 0},  // frame 6：著地
  {dx: -20, dy: 0},  // frame 7：躺平中
  {dx: -21, dy: 0},  // frame 8：幾乎靜止
  {dx: -22, dy: 0},  // frame 9：最終靜止
];
function drawAnimatedSoldier(u){
  const img=soldierImg;
  const fallbackDy=GY-u.sz*2.2;
  if(!img.complete||!img.naturalWidth){
    ctx.save();
    if(u.side!=='player'){ctx.translate(u.x+u.sz/2,u.y+u.sz/2);ctx.scale(-1,1);ctx.translate(-(u.x+u.sz/2),-(u.y+u.sz/2));}
    dSoldier(u.x,u.y,u.sz,u.side==='cpu',u);
    ctx.restore();return u.y;
  }
  const imgW=img.naturalWidth,imgH=img.naturalHeight;
  // ── 依 state 決定 row；animFrame 決定 col ──
  const rowMap={walk:0,attack:1,die:2};
  const row=rowMap[u.state]??0;
  const isDie=u.state==='die';
  const col=isDie ? Math.min(u.animFrame,S_DIE_COLS-1) : Math.min(u.animFrame,S_COLS-1);
  // ── 死亡偏移 ──
  const off=isDie ? deathOffsets[col] : {dx:0,dy:0};
  const avgSw=imgW/S_COLS, avgSh=imgH/S_ROWS;
  let sx_src=Math.round(col*imgW/S_COLS);
  let sw_frame=Math.round((col+1)*imgW/S_COLS)-sx_src;
  let sy_src=Math.round(row*imgH/S_ROWS);
  let sh_frame=Math.round((row+1)*imgH/S_ROWS)-sy_src;
  let currentDh=u.sz*2.2;
  const dw=currentDh*(avgSw/avgSh);
  const dx=u.x+(u.sz-dw)/2;
  let stateYOff=0;
  // 攻擊狀態：向下多抓 8% 高度補回被切斷的腳，等比例放大防變形，再向上拉齊
  if(u.state==='attack'){
    const extraSrcHeight=Math.round(avgSh*0.08);
    sh_frame+=extraSrcHeight;
    const scale=currentDh/avgSh;
    currentDh+=extraSrcHeight*scale;
    stateYOff=-(currentDh*0.15);
  }
  // 陣亡狀態：裁切起始 Y 向下推 12%，切除第二排腳底內容滲入
  if(isDie){
    sy_src+=Math.round(avgSh*0.12);
  }
  // 基準位置 Y 維持走路的完美位置不變
  const dyBase=u.y+u.sz-(u.sz*2.2)+u.sz*0.3;
  const dyClamp=Math.min(dyBase+off.dy, GY-(u.sz*2.2));
  const dy=dyClamp+stateYOff;
  ctx.save();
  if(u.side==='cpu'){
    ctx.filter='hue-rotate(240deg) saturate(1.4)';
    ctx.translate(dx+dw/2-off.dx,0);ctx.scale(-1,1);
    ctx.drawImage(img,sx_src,sy_src,sw_frame,sh_frame,-dw/2,dy,dw,currentDh);
  }else{
    ctx.drawImage(img,sx_src,sy_src,sw_frame,sh_frame,dx+off.dx,dy,dw,currentDh);
  }
  ctx.restore();
  return dy; // 回傳精靈頂端 y，供血條定位
}
function drawUnit(u){
  let spriteTop=null;
  if(u.type==='soldier'){
    spriteTop=drawAnimatedSoldier(u);
  }else{
    ctx.save();
    if(u.side!=='player'){ctx.translate(u.x+u.sz/2,u.y+u.sz/2);ctx.scale(-1,1);ctx.translate(-(u.x+u.sz/2),-(u.y+u.sz/2));}
    const x=u.x,y=u.y,s=u.sz,en=(u.side==='cpu');
    if(u.type==='tank')     dTank(x,y,s,en,u);
    if(u.type==='airplane') dPlane(x,y,s,en,u);
    if(u.type==='robot')    dRobot(x,y,s,en,u);
    ctx.restore();
  }
  // 血條：士兵用 spriteTop（精靈實際頂端）定位，其他兵種用碰撞框上方
  if(u.hp<u.mhp){
    const bw=u.sz+10,bx=u.x-5;
    const by=u.type==='soldier' ? spriteTop-8 : u.y-9;
    ctx.fillStyle='#111';ctx.fillRect(bx,by,bw,5);
    const rt=u.hp/u.mhp;ctx.fillStyle=rt>.5?'#4CAF50':rt>.25?'#FFC107':'#F44336';
    ctx.fillRect(bx,by,bw*rt,5);
  }
}
function dSoldier(x,y,s,en,u){

  ctx.fillStyle='#355466';ctx.beginPath();ctx.arc(s*.6,s*.27,s*.035,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8ad99';ctx.beginPath();ctx.arc(s*.55,s*.35,s*.05,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f4deb4';ctx.fillRect(s*.23,s*.61,s*.5,s*.06);
  ctx.fillStyle='#657e88';ctx.beginPath();ctx.roundRect(s*.67,s*.45,s*.45,s*.12,2);ctx.fill();

function artRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function artEllipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function dTank(x,y,s,en,u){

function dRobot(x,y,s,en,u){

function drawBoom(e){const t=1-e.life/e.max,a=e.life/e.max,r=e.r*t;ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fillStyle=`rgba(255,100,0,${a*.45})`;ctx.fill();ctx.beginPath();ctx.arc(e.x,e.y,r*.5,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,50,${a*.9})`;ctx.fill();if(e.life>e.max*.5){ctx.strokeStyle=`rgba(255,180,0,${a})`;ctx.lineWidth=1.5;for(let i=0;i<6;i++){const ang=(i/6)*Math.PI*2+t*3;ctx.beginPath();ctx.moveTo(e.x+Math.cos(ang)*r*.4,e.y+Math.sin(ang)*r*.4);ctx.lineTo(e.x+Math.cos(ang)*r*.9,e.y+Math.sin(ang)*r*.9);ctx.stroke();}}}

  const UNIT_COST={soldier:1,tank:3,airplane:5,robot:10};
  const UNIT_COST_LBL={soldier:'💰1點',tank:'💰3點',airplane:'💰5點',robot:'💰10點'};
  const btnMap=[['bS','soldier'],['bT','tank'],['bA','airplane'],['bR','robot']];
  document.getElementById('ubtns').dataset.visible=String(currentLevel+1);
  btnMap.forEach(([id,type])=>{
    const btn=document.getElementById(id);
    const uc=btn.querySelector('.uc');
    const unlocked=playerUnlocked(type);
    btn.hidden=!unlocked;
    btn.classList.toggle('ub-poor',unlocked&&pPts<UNIT_COST[type]);
    btn.title=unlocked&&pPts<UNIT_COST[type]?`點數不足，還差 ${UNIT_COST[type]-pPts} 點`:'';
    if(!unlocked){
      btn.disabled=true;
      btn.classList.add('ub-locked');
      uc.textContent=`🔒 第 ${UNLOCK[type]} 關開放`;
    }else{
      btn.classList.remove('ub-locked');
      uc.textContent=UNIT_COST_LBL[type];
      btn.disabled=!canBuy||pPts<UNIT_COST[type];
    }
  });
}
function gameOver(pWin){
  clearRoundTimers();running=false;paused=false;stopBgMusic();questionDelay=0;resultMode=pWin?'won':'lost';
  document.getElementById('pauseOv').style.display='none';
  const final=currentLevel===LEVELS.length-1;
  document.getElementById('restBtn').textContent=pWin?(final?'🔄 再玩四關':'下一關 →'):'🔄 重新挑戰本關';
  const ov=document.getElementById('ov');
  const ot=document.getElementById('ovtitle'),om=document.getElementById('ovmsg');
  if(pWin){
    ov.style.background='rgba(94,156,173,.45)'; // 半透明，煙火可透出
    ot.textContent=final?'🎉 四關全部通過！':`🎉 第 ${currentLevel+1} 關勝利！`;ot.style.color='#347e9c';
    om.textContent=final?'士兵、坦克、飛機和機器人，全都一起守住了城堡！':`城堡守住了！下一關開放${['','坦克','飛機','機器人'][currentLevel+1]}。`;
    sfx('victory',0);
    startVictoryFW();
  }else{
    ov.style.background='rgba(122,151,158,.65)';
    ot.textContent='💀 電腦勝利！';ot.style.color='#bd655f';
    om.textContent=`第 ${currentLevel+1} 關再一起試一次，這次也有收穫！`;
    sfx('defeat',0);
  }
  ov.style.display='flex';
}

// ═══════════════════════════════════════════════════════════
//  GAME LOOP + HELPERS
// ═══════════════════════════════════════════════════════════
let lastFrame=null,frameBudget=0;
function loop(timestamp){
  const elapsed=lastFrame===null?0:Math.min(100,Math.max(0,timestamp-lastFrame));
  lastFrame=timestamp;
  frameBudget+=elapsed;
  while(frameBudget>=1000/60){
    stepFrame();
    frameBudget-=1000/60;
  }
  _bgLoop();render();redraw();
  requestAnimationFrame(loop);
}
function stepFrame(){
  if(paused)return;
  if(running&&questionDelay>0){
    questionDelay-=1000/60;
    if(questionDelay<=0){questionDelay=0;newQ();}
  }
  update();
  // 焰火粒子更新（遊戲結束後也持續）
  for(let i=fwp.length-1;i>=0;i--){
    const p=fwp[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life--;
    if(p.life<=0)fwp.splice(i,1);
  }
  // 磚塊碎片 & 煙霧 物理更新
  for(let i=debrisArr.length-1;i>=0;i--){
    const d=debrisArr[i];d.x+=d.vx;d.y+=d.vy;
    if(!d.smoke){d.vy+=0.18;d.vx*=0.97;}
    d.life--;if(d.life<=0)debrisArr.splice(i,1);
  }
}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

showDiff();
requestAnimationFrame(loop);
