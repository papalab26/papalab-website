<script>
'use strict';
const ANIMALS=[

 {id:'giraffe',word:'giraffe',name:'長頸鹿',color:'#e6c37d',speed:20,diet:['lettuce','cabbage']},

 {id:'duck',word:'duck',name:'鴨子',color:'#f0d486',speed:20,diet:['corn','lettuce'],habitat:'shore'},

 {id:'turtle',word:'turtle',name:'烏龜',color:'#9bb58b',speed:11,diet:['carrot','lettuce','cabbage'],habitat:'shore'},
 {id:'fish',word:'fish',name:'魚',color:'#e7b375',speed:25,diet:[],habitat:'water'},
 {id:'bird',word:'bird',name:'小鳥',color:'#8db8c8',speed:55,diet:['corn','tomato'],habitat:'air'},
 {id:'parrot',word:'parrot',name:'鸚鵡',color:'#df7c6b',speed:48,diet:['corn','carrot','tomato'],habitat:'air'},
 {id:'hippo',word:'hippo',name:'河馬',color:'#aca4b8',speed:14,diet:['lettuce','cabbage','carrot'],habitat:'shore'},
 {id:'buffalo',word:'buffalo',name:'水牛',color:'#8e8875',speed:19,diet:['lettuce','cabbage','corn']},
 {id:'cheetah',word:'cheetah',name:'獵豹',color:'#e5bc77',speed:40,diet:[]},
 {id:'antelope',word:'antelope',name:'羚羊',color:'#c8a477',speed:34,diet:['lettuce','cabbage','carrot']},
 {id:'monkey',word:'monkey',name:'猴子',color:'#ac886c',speed:29,diet:['corn','carrot','tomato','lettuce']},
 {id:'flamingo',word:'flamingo',name:'紅鶴',color:'#e5a19f',speed:22,diet:['corn','lettuce'],habitat:'shore'},
 {id:'warthog',word:'warthog',name:'疣豬',color:'#ac9381',speed:23,diet:['carrot','corn','lettuce']},
 {id:'meerkat',word:'meerkat',name:'狐獴',color:'#c6ab83',speed:28,diet:[]},
 {id:'jackal',word:'jackal',name:'豺狼',color:'#c7a16f',speed:32,diet:[]},
 {id:'hyena',word:'hyena',name:'鬣狗',color:'#b6a17d',speed:30,diet:[]},
 {id:'crocodile',word:'crocodile',name:'鱷魚',color:'#8ba98a',speed:15,diet:[],habitat:'shore'},
 {id:'pelican',word:'pelican',name:'鵜鶘',color:'#f4ead4',speed:24,diet:[],habitat:'shore'}
];
const NOCTURNAL_ANIMALS=[
 {id:'owl',word:'owl',name:'貓頭鷹',color:'#a9b3b5',speed:42,diet:[],habitat:'air',nocturnal:true},
 {id:'bat',word:'bat',name:'蝙蝠',color:'#a39caf',speed:56,diet:[],habitat:'air',nocturnal:true},
 {id:'fox',word:'fox',name:'狐狸',color:'#d9a573',speed:32,diet:['tomato'],nocturnal:true},
 {id:'hedgehog',word:'hedgehog',name:'刺蝟',color:'#b9a188',speed:18,diet:[],nocturnal:true},
 {id:'raccoon',word:'raccoon',name:'浣熊',color:'#a7aaa2',speed:25,diet:['carrot','corn','lettuce','cabbage','broccoli','tomato'],nocturnal:true},
 {id:'mouse',word:'mouse',name:'老鼠',color:'#b7ada4',speed:29,diet:['corn','carrot','tomato','lettuce','cabbage'],nocturnal:true},
 {id:'porcupine',word:'porcupine',name:'豪豬',color:'#ad9982',speed:16,diet:['carrot','corn','lettuce','cabbage','broccoli','tomato'],nocturnal:true},
 {id:'bushbaby',word:'bushbaby',name:'嬰猴',color:'#b2a396',speed:30,diet:['tomato'],nocturnal:true}
];
const ALL_ANIMALS=[...ANIMALS,...NOCTURNAL_ANIMALS];
function eligibleAnimals(){return nightQuiz()?NOCTURNAL_ANIMALS:ANIMALS;}
const SKY_WORDS=[{id:'star',word:'star',name:'星星',period:'night'},{id:'meteor',word:'meteor',name:'流星',period:'night'},{id:'airplane',word:'airplane',name:'飛機',period:'day'},{id:'helicopter',word:'helicopter',name:'直升機',period:'day'}];
const MAX_SKY=12;let skyItems=[];
function skyDef(id){return SKY_WORDS.find(d=>d.id===id);}
function nightQuiz(){return skyState().night>.5;}
function eligibleSkyWords(){return SKY_WORDS.filter(d=>d.period===(nightQuiz()?'night':'day'));}
function skyQuestionAvailable(){return skyItems.length<MAX_SKY&&(!nightQuiz()||Math.random()<.25);}
function pickQuestion(){
 const food=quizKind==='food',night=nightQuiz(),creatures=eligibleAnimals(),extras=eligibleSkyWords(),pool=food?VEGETABLES:[...creatures,...extras];
 const skyAvailable=!food&&skyQuestionAvailable();
 if(!food&&((night&&skyAvailable)||animals.length>=MAX_ANIMALS)){question=shuffle(extras.filter(d=>d.id!==previous))[0];previous=question.id;return pool;}
 const deckPool=food?VEGETABLES:!night&&skyAvailable?[...creatures,...extras]:creatures;
 let deck=(food?foodBag:night?nightBag:bag).filter(d=>deckPool.some(a=>a.id===d.id));const lastId=food?foodPrevious:previous;
 if(!deck.length){deck=shuffle([...deckPool]);if(deck[deck.length-1].id===lastId)deck.unshift(deck.pop());}
 question=deck.pop();if(food){foodBag=deck;foodPrevious=question.id;}else{if(night)nightBag=deck;else bag=deck;previous=question.id;}return pool;
}
const VEGETABLES=[{id:'carrot',word:'carrot',name:'胡蘿蔔'},{id:'corn',word:'corn',name:'玉米'},{id:'cabbage',word:'cabbage',name:'高麗菜'},{id:'broccoli',word:'broccoli',name:'花椰菜'},{id:'tomato',word:'tomato',name:'番茄'},{id:'lettuce',word:'lettuce',name:'萵苣'}];
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');
let W=1000,H=650,animals=[],foods=[],pending=null,question=null,selected=null,bag=[],nightBag=[],previous=null,foodBag=[],foodPrevious=null,quizKind='animal',sound=true,last=0,time=0,worldTime=20,toastTimer,voice=null,foodUid=0,saveElapsed=0;
const LEGACY_STORE='papalab-savanna-friends-v1';
const STORE='papalab-savanna-friends-pond-v3',MAX_ANIMALS=40,MAX_FOODS=20,DAY_SECONDS=180,NIGHT_SECONDS=60;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function random(a,b){return a+Math.random()*(b-a)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function voices(){if(!('speechSynthesis' in window)){ $('voice-note').textContent='這個瀏覽器不支援英文發音；仍可看圖選字。';return}const list=speechSynthesis.getVoices();voice=list.find(v=>v.lang==='en-US')||list.find(v=>v.lang.startsWith('en'));$('voice-note').textContent=voice?'點選單字可聽英文發音。':'裝置未提供英文語音，發音可能無法播放。';}
voices();if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',voices);
function speak(word){if(!sound||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.8;if(voice)u.voice=voice;speechSynthesis.speak(u)}
let audioContext=null;const feedbackNotes=new Set();
function feedbackSound(correct){
 if(!sound)return;
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
 audioContext ||= new Audio();const context=audioContext;
 const play=()=>{if(!sound||document.hidden)return;const start=context.currentTime+.015;
 const notes=correct?[[523.25,0,.13],[659.25,.13,.13],[783.99,.26,.24]]:[[330,0,.16],[261.63,.17,.22]];
 for(const [frequency,offset,duration]of notes){const osc=context.createOscillator(),gain=context.createGain();osc.type='sine';osc.frequency.value=frequency;osc.connect(gain);gain.connect(context.destination);const t=start+offset;
 gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.15,t+.012);gain.gain.exponentialRampToValueAtTime(.001,t+duration);osc.start(t);osc.stop(t+duration+.02);feedbackNotes.add(osc);osc.onended=()=>{feedbackNotes.delete(osc);osc.disconnect();gain.disconnect()};}}
 if(context.state==='running')play();else context.resume().then(play).catch(()=>{});
 }catch(e){/* Audio unavailable: retain visual feedback. */}
}
function silence(){if('speechSynthesis' in window)speechSynthesis.cancel();for(const note of feedbackNotes){try{note.stop()}catch(e){}}feedbackNotes.clear();}

function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true},2500)}
let labelTarget=null,labelTimer;
function hideEntityLabel(){clearTimeout(labelTimer);labelTarget=null;$('entity-label').hidden=true;}
function showEntityLabel(entity,type,definition){clearTimeout(labelTimer);labelTarget={entity,type};$('entity-word').textContent=definition.word;$('entity-name').textContent=definition.name;$('entity-label').hidden=false;updateEntityLabel();labelTimer=setTimeout(hideEntityLabel,2500);}
function updateEntityLabel(){if(!labelTarget)return;const {entity,type}=labelTarget;if(!(type==='animal'?animals:type==='sky'?skyItems:foods).includes(entity)){hideEntityLabel();return;}const label=$('entity-label'),area=canvas.parentElement.getBoundingClientRect(),r=canvas.getBoundingClientRect(),scaleX=r.width/W,scaleY=r.height/H;
const x=r.left-area.left+entity.x*scaleX,y=r.top-area.top+(entity.y-(type==='animal'?(['giraffe','ostrich','flamingo'].includes(entity.id)?100:habitat(entity.id)==='water'?25:habitat(entity.id)==='air'?45+entity.altitude:60):25))*scaleY,offset=(type==='animal'?unitSize()*.58:32)*scaleX+8;
const w=label.offsetWidth,h=label.offsetHeight;let left=x+offset;if(left+w>area.width-8)left=x-offset-w;label.style.left=clamp(left,8,Math.max(8,area.width-w-8))+'px';label.style.top=clamp(y-h/2,8,Math.max(8,area.height-h-8))+'px';}
function groundTop(){return H*.43}function groundBottom(){return Math.max(groundTop()+90,H-90)}function unitSize(){return 100}
// Trace both painted grass curves, including the green hills above the foreground.
function grassTop(x){x=clamp(x,0,W);const t=(-900+Math.sqrt(810000+400*x))/200,front=.5*(1-t)**2+.68*(1-t)*t+.52*t*t;
 const u=x<=500?(-440+Math.sqrt(193600+240*x))/120:(520-Math.sqrt(270400-80*(x-500)))/40;
 const hill=x<=500?.44*(1-u)**2+.58*(1-u)*u+.43*u*u:.43*(1-u)**2+.64*(1-u)*u+.43*u*u;
 return H*Math.min(front,hill);}

function groundY(y,x=W*.5){return clamp(y,grassTop(x)+8,H-18)}
function onGrass(x,y){return x>=0&&x<=W&&y>=grassTop(x)&&y<=H&&!inPond(x,y);}

function pond(){const ry=2*Math.min(65,Math.max(22,(groundBottom()-groundTop()-35)/2.6));return {x:W*.92,y:H-ry*.45,rx:320,ry};}
function inPond(x,y){const p=pond();return ((x-p.x)/(p.rx+6))**2+((y-p.y)/(p.ry+4))**2<1;}
function nearPond(x,y){const p=pond();return ((x-p.x)/(p.rx+55))**2+((y-p.y)/(p.ry+48))**2<=1;}
function animalDef(id){return ALL_ANIMALS.find(d=>d.id===id);}
function habitat(id){return animalDef(id).habitat||'land';}
function pondPoint(scale=.76){const p=pond();for(let i=0;i<100;i++){const angle=random(0,Math.PI*2),r=Math.sqrt(Math.random())*scale,q={x:p.x+Math.cos(angle)*p.rx*r,y:p.y+Math.sin(angle)*p.ry*r};if(q.x>=35&&q.x<=W-35&&q.y>=grassTop(q.x)+8&&q.y<=H-24)return q;}return {x:p.x-p.rx*.45,y:Math.min(p.y,H-24)};}

function fitHabitat(a){const h=habitat(a.id),p=pond();if(h==='water'){const dx=(a.x-p.x)/(p.rx*.78),dy=(a.y-p.y)/(p.ry*.78),r=Math.hypot(dx,dy);if(r>1){a.x=p.x+dx/r*p.rx*.78;a.y=p.y+dy/r*p.ry*.78;}a.x=clamp(a.x,35,W-35);a.y=clamp(a.y,grassTop(a.x)+8,H-24);}else if(h==='shore'&&!nearPond(a.x,a.y)){a.x=p.x-p.rx*.7;a.y=Math.min(p.y,H-24);}else if(h==='land'&&inPond(a.x,a.y)){a.x=p.x-p.rx-30;}
 if(h!=='water'){a.x=clamp(a.x,35,W-35);a.y=groundY(a.y,a.x);}
 a.targetX=a.x;a.targetY=a.y;return a;}
function sleepingTime(a){const age=worldTime%240;return animalDef(a.id).nocturnal?age>=a.dawnSleep&&age<a.duskWake:age>=a.sleepAt||age<a.wakeAt;}
function startSleep(a){endGreeting(a);a.mode='sleeping';a.foodTarget=null;a.route=[];a.run=false;a.targetX=a.x;a.targetY=a.y;a.altitude=0;}
function startRest(a){endGreeting(a);a.mode='resting';a.foodTarget=null;a.route=[];a.run=false;a.targetX=a.x;a.targetY=a.y;a.altitude=0;a.activityLeft=random(4,8);}
function wanderGoal(a){const h=habitat(a.id);if(h==='water'){const q=pondPoint();a.targetX=q.x;a.targetY=q.y;}else if(h==='shore'){const q=pondPoint(Math.random()<.65?.76:1.15);a.targetX=clamp(q.x,70,W-70);a.targetY=groundY(q.y);}else{a.targetX=random(90,W-90);a.targetY=groundY(random(groundTop()+80,groundBottom()));if(inPond(a.targetX,a.targetY))a.targetX=pond().x-pond().rx-45;}a.route=[];a.run=a.pace>1.25;a.wait=random(1,4);}

function greet(a,allowChase=false){
 const h=habitat(a.id);const b=animals.filter(b=>b!==a&&b.mode==='wander'&&b.action<=0&&b.lifeLeft>5&&
 (h==='water'?habitat(b.id)==='water':h==='shore'&&habitat(b.id)==='shore'?nearPond(a.x,a.y)&&nearPond(b.x,b.y):habitat(b.id)!=='water'&&!inPond(a.x,a.y)&&!inPond(b.x,b.y)))
 .sort((b,c)=>Math.hypot(b.x-a.x,b.y-a.y)-Math.hypot(c.x-a.x,c.y-a.y))[0];
 a.nextSocial=random(12,24);if(!b||Math.hypot(b.x-a.x,b.y-a.y)>180)return;
 if(allowChase&&habitat(b.id)===h&&Math.random()<.55){startChase(a,b);return;}
 for(const [friend,other]of [[a,b],[b,a]]){friend.mode='greeting';friend.partner=other;friend.route=[];friend.foodTarget=null;friend.run=false;friend.targetX=friend.x;friend.targetY=friend.y;friend.activityLeft=random(2.5,4);friend.dir=friend.x<other.x?1:-1;friend.nextSocial=random(15,30);friend.altitude=0;}
}
function isChasing(a){return a.mode==='chaseLeader'||a.mode==='chaseFollower';}
function changePace(a){const r=Math.random();a.targetPace=r<.30?random(.55,.8):r<.70?random(.9,1.1):random(1.35,1.75);a.nextPace=random(3,7);}
function chooseChaseGoal(a){
 const h=habitat(a.id);let goal=null;
 if(h==='water'||h==='shore')goal=pondPoint(h==='water'?.70:.90);
 else for(let i=0;i<24;i++){const angle=random(0,Math.PI*2),distance=random(100,200),q={x:clamp(a.x+Math.cos(angle)*distance,80,W-80),y:clamp(a.y+Math.sin(angle)*distance*.4,grassTop(a.x)+18,H-30)};
 if(onGrass(q.x,q.y)&&Math.hypot(q.x-a.x,q.y-a.y)>35){goal=q;break;}}
 if(!goal)goal={x:a.x,y:a.y};a.targetX=goal.x;a.targetY=goal.y;a.turnLeft=random(1.8,3.2);a.route=[];
}
function startChase(a,b){
 if(a===b||a.mode!=='wander'||b.mode!=='wander'||habitat(a.id)!==habitat(b.id)||a.lifeLeft<10||b.lifeLeft<10)return false;
 const duration=random(5,9),speed=Math.min(animalDef(a.id).speed,animalDef(b.id).speed)*1.65;
 for(const [friend,other,mode]of [[a,b,'chaseLeader'],[b,a,'chaseFollower']]){friend.mode=mode;friend.partner=other;friend.foodTarget=null;friend.activityLeft=duration;friend.nextSocial=random(15,28);friend.run=true;friend.playSpeed=speed;friend.route=[];friend.wait=0;}
 chooseChaseGoal(a);b.targetX=a.x;b.targetY=a.y;return true;
}
function prepareChase(a,dt){
 const b=a.partner;a.activityLeft-=dt;
 if(!b||!animals.includes(b)||!isChasing(b)||b.partner!==a||a.activityLeft<=0||Math.hypot(a.x-b.x,a.y-b.y)>330){releaseAnimal(a);return false;}
 if(a.mode==='chaseLeader'){a.turnLeft-=dt;if(a.turnLeft<=0||Math.hypot(a.x-a.targetX,a.y-a.targetY)<6)chooseChaseGoal(a);}
 else {a.targetX=b.x;a.targetY=b.y;if(Math.hypot(a.x-b.x,a.y-b.y)<65){a.phase+=dt*.4;return false;}}
 return true;
}
function startLeaving(a){endGreeting(a);a.mode='leaving';a.foodTarget=null;a.route=[];a.run=false;a.action=0;
 // Land friends walk off the left; aquatic friends swim out through the right-hand pool.
 a.targetX=habitat(a.id)==='land'?-120:W+120;a.targetY=a.y;if(habitat(a.id)==='land'){a.targetY=Math.min(a.y,pond().y-pond().ry-18);a.route=[{x:a.x,y:a.targetY}];}else if(habitat(a.id)==='water'){a.targetY=Math.min(pond().y,H-24);}a.dir=a.targetX>a.x?1:-1;}
function walkAway(a,dt){const speed=Math.max(80,animalDef(a.id).speed*2),goal=a.route.length?a.route[0]:{x:a.targetX,y:a.targetY},dx=goal.x-a.x,dy=goal.y-a.y,distance=Math.hypot(dx,dy);if(distance<2&&a.route.length){a.route.shift();return;}if(distance>0){const step=Math.min(speed*dt,distance);a.x+=dx/distance*step;a.y+=dy/distance*step;}a.phase+=dt;if(habitat(a.id)==='air')a.altitude=Math.min(55,a.altitude+dt*18);}
function releaseAnimal(a){endGreeting(a);a.mode='wander';a.foodTarget=null;a.route=[];a.activityLeft=0;a.targetX=a.x;a.targetY=a.y;a.wait=random(1,3);a.run=false}
function planDrink(a){const p=pond();a.mode='toWater';a.foodTarget=null;a.run=false;a.targetX=p.x-p.rx-42;a.targetY=groundY(Math.min(p.y,H-24),a.targetX)}
function planFood(a,f){const side=a.x<f.x?-1:1;a.mode='toFood';a.foodTarget=f.uid;a.run=false;a.route=[];const reach=habitat(a.id)==='air'?36:habitat(a.id)==='shore'?40:72;
 const approaches=[{x:clamp(f.x+side*reach,35,W-35),y:f.y+15},{x:clamp(f.x-side*reach,35,W-35),y:f.y+15},{x:f.x,y:f.y-20},{x:f.x,y:f.y}];
 const goal=approaches.find(q=>onGrass(q.x,q.y)&&(habitat(a.id)!=='shore'||nearPond(q.x,q.y)))||{x:f.x,y:f.y};a.targetX=goal.x;a.targetY=groundY(goal.y,goal.x);}
function inviteToFood(f){const hungry=animals.filter(a=>animalDef(a.id).diet.includes(f.id)&&a.mode!=='leaving'&&a.mode!=='sleeping'&&a.mode!=='eating'&&a.mode!=='toFood'&&a.action<=0&&(habitat(a.id)!=='shore'||nearPond(f.x,f.y)))
 .sort((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y));
 for(const a of hungry.slice(0,3)){a.nextEat=0;releaseAnimal(a);planFood(a,f);}}

function chooseFood(a){const diet=ALL_ANIMALS.find(d=>d.id===a.id).diet;return foods.filter(f=>f.bites>0&&diet.includes(f.id)&&(habitat(a.id)!=='shore'||nearPond(f.x,f.y))).sort((f,g)=>Math.hypot(f.x-a.x,f.y-a.y)-Math.hypot(g.x-a.x,g.y-a.y))[0]}
function takeBite(a){const f=foods.find(f=>f.uid===a.foodTarget);if(!f||f.bites<=0)return false;f.bites-=1;if(f.bites<=0){foods=foods.filter(v=>v.uid!==f.uid);updateCounts()}save();return true}
function update(dt){if(!$('quiz').hidden)return;const previousWorldTime=worldTime;worldTime=(worldTime+dt)%240;if(worldTime<previousWorldTime)for(const a of animals){a.sleepAt=random(190,220);a.wakeAt=random(3,24);a.dawnSleep=random(8,24);a.duskWake=random(160,172);}updateSky(dt);saveElapsed+=dt;if(saveElapsed>10){save();saveElapsed=0}for(const a of animals){a.lifeLeft-=dt;a.nextSocial-=dt;if(a.lifeLeft<=0&&a.mode!=='leaving')startLeaving(a);if(a.mode==='leaving'){walkAway(a,dt);continue;}a.nextPace-=dt;if(a.nextPace<=0)changePace(a);a.pace+=(a.targetPace-a.pace)*(1-Math.exp(-dt*2.5));a.run=isChasing(a)||a.pace>1.25;a.action=Math.max(0,a.action-dt);a.nextDrink-=dt;a.nextEat-=dt;a.nextRest-=dt;a.wait-=dt;if(a.action>0)continue;
 const h=habitat(a.id);if(sleepingTime(a)){if(a.mode!=='sleeping')startSleep(a);continue;}if(a.mode==='sleeping'){releaseAnimal(a);a.nextRest=random(10,25);a.nextDrink=random(8,25);a.nextEat=random(3,10);}
 if(isChasing(a)&&!prepareChase(a,dt))continue;
 if(a.mode==='greeting'){a.phase+=dt;a.activityLeft-=dt;if(a.activityLeft<=0)releaseAnimal(a);continue;}
 if(a.mode==='resting'){a.activityLeft-=dt;if(a.activityLeft<=0){a.nextRest=random(16,34);releaseAnimal(a)}continue;}
 if(h==='water'&&a.mode==='wander'&&a.nextRest<=0)startRest(a);
 if(a.mode==='resting')continue;
 if(a.mode==='drinking'){a.phase+=dt;a.activityLeft-=dt;if(a.activityLeft<=0){a.nextDrink=random(25,55);releaseAnimal(a)}continue}
 if(a.mode==='eating'){a.phase+=dt;a.activityLeft-=dt;a.biteLeft-=dt;const f=foods.find(f=>f.uid===a.foodTarget);if(!f||a.activityLeft<=0){a.nextEat=random(10,25);releaseAnimal(a);continue}if(a.biteLeft<=0){takeBite(a);a.biteLeft=1.6;if(!foods.some(f=>f.uid===a.foodTarget)){a.nextEat=random(10,25);releaseAnimal(a)}}continue}
 if(a.mode==='toFood'&&!foods.some(f=>f.uid===a.foodTarget)){a.nextEat=random(2,5);releaseAnimal(a)}
 if(a.mode==='wander'){const meal=h!=='water'&&a.nextEat<=0?chooseFood(a):null;
 if(meal)planFood(a,meal);else if(a.nextRest<=0){startRest(a);continue;}else if(h!=='water'&&a.nextDrink<=0)planDrink(a);else{if(a.nextEat<=0)a.nextEat=random(3,8);if(a.nextSocial<=0)greet(a,true);if(a.mode==='greeting'||isChasing(a))continue;}}

 const goal=a.route&&a.route.length?a.route[0]:{x:a.targetX,y:a.targetY},dx=goal.x-a.x,dy=goal.y-a.y,dist=Math.hypot(dx,dy);
 if(dist<4){if(isChasing(a))continue;if(a.route&&a.route.length){a.route.shift();continue;}if(a.mode==='toWater'){a.mode='drinking';if(h==='air')a.altitude=0;a.dir=a.x<pond().x?1:-1;a.activityLeft=random(3.5,5.5);a.phase=0}
 else if(a.mode==='toFood'){const f=foods.find(f=>f.uid===a.foodTarget);if(f){a.mode='eating';if(h==='air')a.altitude=0;a.dir=a.x<f.x?1:-1;a.activityLeft=9;a.biteLeft=1.2;a.phase=0}else releaseAnimal(a)}
 else if(a.wait<=0){wanderGoal(a)}}
 else {const def=ALL_ANIMALS.find(d=>d.id===a.id),v=(isChasing(a)?a.playSpeed*(a.mode==='chaseFollower'?1.12:1):a.mode==='toFood'?Math.max(def.speed*a.pace,Math.min(65,24+dist/12)):def.speed*a.pace)*dt;const nx=a.x+dx/dist*Math.min(v,dist),ny=a.y+dy/dist*Math.min(v,dist);if(h==='land'&&inPond(nx,ny)){const p=pond(),routeY=groundY(p.y-p.ry-45),entryX=clamp(a.x<p.x?p.x-p.rx-35:p.x+p.rx+35,35,W-35),exitX=clamp(a.targetX<p.x?p.x-p.rx-35:p.x+p.rx+35,35,W-35);a.route=[{x:entryX,y:routeY},{x:exitX,y:routeY}];continue;}a.x=nx;a.y=ny;a.dir=dx>=0?1:-1;a.phase+=dt*clamp(v/dt/def.speed,.55,2.3);if(h==='air')a.altitude=30+Math.sin(a.phase*1.5)*12;}
 }const remaining=animals.filter(a=>a.mode!=='leaving'||(a.x>-115&&a.x<W+115));if(remaining.length!==animals.length){animals=remaining;updateCounts();save();updateEntityLabel();}}
function render(){updateEntityLabel();scenery();for(const a of skyItems)drawSkyItem(ctx,a,a.id==='star'?90:a.id==='meteor'?100:125);const objects=[...foods.map(f=>({y:f.y,type:'food',data:f})),...animals.map(a=>({y:a.y,type:'animal',data:a}))].sort((a,b)=>a.y-b.y);for(const o of objects){if(o.type==='food'){const f=o.data;drawFood(ctx,f.id,f.x,f.y,60,f.bites)}else{const a=o.data,moving=Math.hypot(a.targetX-a.x,a.targetY-a.y)>4&&a.action===0&&$('quiz').hidden;if(habitat(a.id)==='air'&&a.altitude>0)ellipse(ctx,a.x,a.y,14,3,'#597b4820');inPondDrawing=inPond(a.x,a.y);ctx.save();if(a.mode==='leaving')ctx.globalAlpha=clamp(a.dir<0?(a.x+110)/110:(W+110-a.x)/110,0,1);drawAnimal(ctx,a.id,a.x,a.y-(a.altitude||0),unitSize()*(['duck','frog','turtle','fish','bird','parrot','owl','bat','hedgehog','mouse'].includes(a.id)?.72:1),a.dir,a.phase,a.mode==='greeting'?.8:isChasing(a)?.4:a.action,moving&&a.mode!=='resting'&&a.mode!=='sleeping',a.mode);ctx.restore()}}const night=skyState().night;if(night>0){ctx.fillStyle=`rgba(29,43,65,${night*.12})`;ctx.fillRect(0,0,W,H)}}
function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!document.hidden){if($('quiz').hidden)time+=dt;update(dt);render()}requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden){silence();save()}});window.addEventListener('pagehide',save);resize();restore();updateCounts();requestAnimationFrame(frame);
</script>
